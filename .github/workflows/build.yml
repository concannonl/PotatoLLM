name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'To publish a release, enter a version such as 0.1.0 (leave empty to just build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: powershell
        run: |
          $release = '${{ github.event.inputs.release_version }}'.Trim() -replace '^v', ''
          if ($release) { $version = $release }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          else { $version = "0.0.${{ github.run_number }}-dev" }
          $publish = if ($release -or $env:GITHUB_REF_TYPE -eq 'tag') { 'true' } else { 'false' }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "publish=$publish" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build app and installer
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: PotatoLLM-Setup
          path: output/PotatoLLM-Setup.exe

      - name: Publish a release
        if: steps.version.outputs.publish == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $files = @('output/PotatoLLM-Setup.exe') + (Get-ChildItem output -Filter '*-source.tar.gz' | ForEach-Object { $_.FullName })
          gh release create $tag @files --target $env:GITHUB_SHA --title "PotatoLLM $tag" --notes-file .github/release-notes.md
