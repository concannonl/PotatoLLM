name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and installer
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "0.0.${{ github.run_number }}-dev" }
          ./build/build.ps1 -Version $version

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: PotatoLLM-Setup
          path: output/PotatoLLM-Setup.exe

      - name: Publish a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @('output/PotatoLLM-Setup.exe') + (Get-ChildItem output -Filter '*-source.tar.gz' | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" @files --title "PotatoLLM ${{ github.ref_name }}" --notes-file .github/release-notes.md
